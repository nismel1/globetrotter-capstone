# ============================================================
# BASES DE DONNÉES (Seul bloc natif externe accepté)
# ============================================================
databases:
  - name: globetrotter-postgres
    databaseName: globetrotter
    user: admin
    plan: free

# ============================================================
# SERVICES (Web apps, services privés, Redis, RabbitMQ)
# ============================================================
services:
  # ============================================================
  # REDIS (Correction : Déclaré en tant que service avec type: redis)
  # ============================================================
  - type: redis
    name: globetrotter-redis
    plan: free

  # ============================================================
  # RABBITMQ
  # ============================================================
  - type: web
    name: globetrotter-rabbitmq
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        sync: false
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # ============================================================
  # OSRM (Calcul d'itinéraires)
  # ============================================================
  - type: web
    name: globetrotter-osrm
    env: docker
    plan: free

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-auth-service
    env: docker
    rootDir: backend/auth-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        fromService:
          type: web
          name: globetrotter-api-gateway
          property: env:JWT_SECRET
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # CATALOG SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-catalog-service
    env: docker
    rootDir: backend/catalog-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ITINERARY SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-itinerary-service
    env: docker
    rootDir: backend/itinerary-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # RECOMMENDATION SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-recommendation-service
    env: docker
    rootDir: backend/recommendation-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ANALYTICS SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-analytics-service
    env: docker
    rootDir: backend/analytics-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: RABBITMQ_URL
        value: amqp://globetrotter-rabbitmq:5672

  # ============================================================
  # CHATBOT SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-chatbot-service
    env: docker
    rootDir: backend/chatbot-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3006
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: globetrotter-api-gateway
          property: env:JWT_SECRET
      - key: CATALOG_SERVICE_URL
        value: http://globetrotter-catalog-service:3002
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # GROUP SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-group-service
    env: docker
    rootDir: backend/group-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3007
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://globetrotter-rabbitmq:5672

  # ============================================================
  # MESSAGE SERVICE
  # ============================================================
  - type: pserv
    name: globetrotter-message-service
    env: docker
    rootDir: backend/message-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3008
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        fromService:
          type: web
          name: globetrotter-api-gateway
          property: env:JWT_SECRET
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
