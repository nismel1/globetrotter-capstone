# ============================================================
# BASES DE DONNÉES (Bloc natif externe)
# ============================================================
databases:
  - name: globetrotter-postgres
    databaseName: globetrotter
    user: admin
    plan: free

# ============================================================
# GROUPES DE VARIABLES D'ENVIRONNEMENT PARTAGÉES
# ============================================================
envVarGroups:
  - name: globetrotter-shared-secrets
    envVars:
      - key: JWT_SECRET
        sync: false

# ============================================================
# SERVICES (Tous configurés en 'type: web' pour être gratuits)
# ============================================================
services:
  # ============================================================
  # REDIS
  # ============================================================
  - type: redis
    name: globetrotter-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Interne Render

  # ============================================================
  # RABBITMQ
  # ============================================================
  - type: web
    name: globetrotter-rabbitmq
    env: image
    image:
      url: rabbitmq:3-management
    plan: free
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: globetrotter_admin
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # ============================================================
  # OSRM (Calcul d'itinéraires)
  # ============================================================
  - type: web
    name: globetrotter-osrm
    env: image
    image:
    url: osrm/osrm-backend:latest
    plan: free


  # ============================================================
  # AUTH SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web pour la compatibilité plan free
    name: globetrotter-auth-service
    env: docker
    rootDir: backend/auth-service
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # CATALOG SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-catalog-service
    env: docker
    rootDir: backend/catalog-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ITINERARY SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-itinerary-service
    env: docker
    rootDir: backend/itinerary-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # RECOMMENDATION SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-recommendation-service
    env: docker
    rootDir: backend/recommendation-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ANALYTICS SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-analytics-service
    env: docker
    rootDir: backend/analytics-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: RABBITMQ_URL
        value: amqp://globetrotter_admin:${RABBITMQ_DEFAULT_PASS}@globetrotter-rabbitmq:5672

  # ============================================================
  # CHATBOT SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-chatbot-service
    env: docker
    rootDir: backend/chatbot-service
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3006
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CATALOG_SERVICE_URL
        value: http://globetrotter-catalog-service:3002
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # GROUP SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-group-service
    env: docker
    rootDir: backend/group-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3007
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString
      - key: RABBITMQ_URL
        value: amqp://globetrotter_admin:${RABBITMQ_DEFAULT_PASS}@globetrotter-rabbitmq:5672

  # ============================================================
  # MESSAGE SERVICE
  # ============================================================
  - type: web # <-- Remplacé pserv par web
    name: globetrotter-message-service
    env: docker
    rootDir: backend/message-service
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3008
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
