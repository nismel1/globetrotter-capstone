# ============================================================
# BASES DE DONNÉES (Bloc natif externe)
# ============================================================
databases:
  - name: globetrotter-postgres
    databaseName: globetrotter
    user: admin
    plan: free

# ============================================================
# GROUPES DE VARIABLES D'ENVIRONNEMENT PARTAGÉES
# ============================================================
envVarGroups:
  - name: globetrotter-shared-secrets
    envVars:
      - key: JWT_SECRET
        sync: false

# ============================================================
# SERVICES
# ============================================================
services:
  # ============================================================
  # API GATEWAY (Le point d'entrée public de votre Backend)
  # ============================================================
  - type: web
    name: globetrotter-api-gateway
    env: docker
    rootDir: backend/api-gateway # <-- Ajustez si le dossier s'appelle différemment
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # On passe les URLs internes des microservices à la Gateway pour les redirections :
      - key: AUTH_SERVICE_URL
        value: http://globetrotter-auth-service:3001
      - key: CATALOG_SERVICE_URL
        value: http://globetrotter-catalog-service:3002
      - key: ITINERARY_SERVICE_URL
        value: http://globetrotter-itinerary-service:3003
      - key: RECOMMENDATION_SERVICE_URL
        value: http://globetrotter-recommendation-service:3004
      - key: ANALYTICS_SERVICE_URL
        value: http://globetrotter-analytics-service:3005
      - key: CHATBOT SERVICE URL
        value: http://globetrotter-chatbot-service:3006
      - key: GROUP_SERVICE_URL
        value: http://globetrotter-group-service:3007
      - key: MESSAGE_SERVICE_URL
        value: http://globetrotter-message-service:3008

  
  # ============================================================
  # FRONTEND (Site Statique - Corrigé avec la bonne syntaxe)
  # ============================================================
  - type: web
    name: globetrotter-frontend
    env: static # <-- Correction : C'est ici qu'on définit le type statique sur Render
    buildCommand: npm install && npm run build
    staticPublishPath: dist ## <-- Mettre 'build' si vous n'utilisez pas Vite (ex: Create React App)
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: globetrotter-api-gateway
          property: host

  # ============================================================
  # REDIS
  # ============================================================
  - type: redis
    name: globetrotter-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Interne Render

  # ============================================================
  # RABBITMQ
  # ============================================================
  - type: web
    name: globetrotter-rabbitmq
    env: docker
    dockerfilePath: Dockerfile.rabbitmq
    plan: free
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: globetrotter_admin
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # ============================================================
  # OSRM
  # ============================================================
  - type: web
    name: globetrotter-osrm
    env: docker
    dockerfilePath: Dockerfile.osrm
    plan: free

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  - type: web
    name: globetrotter-auth-service
    env: docker
    rootDir: backend/auth-service
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # CATALOG SERVICE
  # ============================================================
  - type: web
    name: globetrotter-catalog-service
    env: docker
    rootDir: backend/catalog-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ITINERARY SERVICE
  # ============================================================
  - type: web
    name: globetrotter-itinerary-service
    env: docker
    rootDir: backend/itinerary-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port

  # ============================================================
  # RECOMMENDATION SERVICE
  # ============================================================
  - type: web
    name: globetrotter-recommendation-service
    env: docker
    rootDir: backend/recommendation-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # ANALYTICS SERVICE
  # ============================================================
  - type: web
    name: globetrotter-analytics-service
    env: docker
    rootDir: backend/analytics-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: globetrotter-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: globetrotter-postgres
          property: port
      - key: RABBITMQ_URL
        value: amqp://globetrotter_admin:${RABBITMQ_DEFAULT_PASS}@globetrotter-rabbitmq:5672

  # ============================================================
  # CHATBOT SERVICE
  # ============================================================
  - type: web
    name: globetrotter-chatbot-service
    env: docker
    rootDir: backend/chatbot-service
    plan: free
    envVars:
      - fromGroup: globetrotter-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3006
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CATALOG_SERVICE_URL
        value: http://globetrotter-catalog-service:3002
      - key: REDIS_URL
        fromService:
          type: redis
          name: globetrotter-redis
          property: connectionString

  # ============================================================
  # GROUP SERVICE
  # ============================================================
  - type: web
    name: globetrotter-group-service
    env: docker
    rootDir: backend/group-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3007
      - key: DB_HOST
        fromDatabase:
          name: globetrotter-postgres
          property: host
      - key: DB_USER
        fromDatabase:
          name: globetrotter-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: globetrotter-postgres
          property: password
      - key: DB_NAME
